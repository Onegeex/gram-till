<!doctype html>
<!-- Dev-only design preview of the phone app with sample data: /preview.html (not part of the build). -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gram Till preview</title></head>
<body><div id="app"></div>
<script type="module">
  const html = await (await fetch('/index.html')).text()
  const style = new DOMParser().parseFromString(html, 'text/html').querySelector('style')
  document.head.appendChild(style)
  const { mountCompanion } = await import('/src/companion.ts')
  const { tillCard, confirmCard, listeningCard } = await import('/src/format.ts')
  const q = new URLSearchParams(location.search)
  const c = mountCompanion({ server: 'https://gram-till.vercel.app', pair: async () => {}, unpair: async () => {}, typed: async () => {}, press: async () => {}, remind: async () => ({ ok: true, message: 'ok' }), cancel: async () => {} })
  const snap = {
    seller: { name: 'Corner Coffee', address: '0QCOmFghR0fSUPi9us4Lc4g-XdS8Z1TipSloAqopL-QVxAGc', network: 'testnet' },
    today: { total: '214', paid: 18, unmatched: 1, waiting: 2 },
    waiting: [
      { id: 1, code: 'GT-H3ZC', label: 'Table 4', item: '2x latte', amount: '8', status: 'waiting', agoMin: 3, expired: false },
      { id: 2, code: 'GT-4G9D', label: 'Aisha', item: null, amount: '3', status: 'waiting', agoMin: 41, expired: true },
    ],
    recent: [
      { amount: '5', result: 'paid', label: 'Maria', comment: 'GT-RQ2R', agoMin: 2 },
      { amount: '5', result: 'underpaid', label: 'Kenji', comment: 'GT-TZGK', agoMin: 6 },
      { amount: '20', result: 'unmatched', label: null, comment: 'thanks!', agoMin: 30 },
    ],
  }
  if (q.has('video')) {
    // Same day as the recorded demo session (for the video's listening shot).
    snap.today = { total: '18.5', paid: 3, unmatched: 0, waiting: 1 }
    snap.waiting = [{ id: 4, code: 'GT-85HU', label: 'Lucas', item: 'croissant', amount: '3.5', status: 'waiting', agoMin: 1, expired: false }]
    snap.recent = [{ amount: '6', result: 'paid', label: 'Aisha', comment: 'GT-24QZ', agoMin: 1 }, { amount: '4.5', result: 'paid', label: 'Table 2', comment: 'GT-C588', agoMin: 1 }, { amount: '8', result: 'paid', label: 'Kenji', comment: 'GT-A8S2', agoMin: 1 }]
  }
  if (q.has('setup')) c.state({ paired: false, server: 'https://gram-till.vercel.app' })
  else {
    c.state({ paired: true, server: '', shop: 'Corner Coffee', network: 'testnet', snapshot: snap })
    if (q.has('listen')) c.mirror(listeningCard(Number(q.get('sec') ?? 6), snap, Number(q.get('level') ?? 0.2), q.has('heard')), 'listening')
    else if (q.has('confirm')) c.mirror(confirmCard({ id: 'x', kind: 'charge', label: 'Table 4', amount: '8', item: '2x latte', reachable: false, expiresInSec: 20 }, snap, 14), 'confirm')
    else c.mirror(tillCard(snap), 'till')
    if (!q.has('video')) c.transcript('charge table four, two lattes')
  }
</script></body></html>
